name: qbudget
services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./frontend/.env
    environment:
      PORT: "8080"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    init: true
  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    # Sync dependencies with the lockfile on every startup.
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://backend:8080
      VITE_API_URL: ""
      USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Isolate Linux packages from any host node_modules installation.
      - frontend_modules:/app/node_modules
      - npm_cache:/root/.npm
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    init: true
volumes:
  frontend_modules:
  npm_cache:
